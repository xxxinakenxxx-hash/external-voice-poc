<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title><?= model.pageTitle ?></title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe7;
        --panel: #ffffff;
        --panel-soft: #faf6ef;
        --text: #1f2937;
        --muted: #5c6877;
        --accent: #173d5f;
        --accent-strong: #f0892b;
        --border: #d8e0ea;
        --shadow: 0 16px 38px rgba(23, 61, 95, 0.12);
        --danger: #b42318;
        --danger-soft: #fdecec;
        --success: #146c43;
        --success-soft: #e8f6ef;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(240, 137, 43, 0.12), transparent 36%),
          radial-gradient(circle at bottom right, rgba(23, 61, 95, 0.10), transparent 30%),
          linear-gradient(180deg, #fdf8ef 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: calc(14px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .layout {
        display: grid;
        gap: 10px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        padding: 22px 20px;
        background: linear-gradient(135deg, rgba(23, 61, 95, 0.98), rgba(30, 83, 128, 0.96));
        color: #fff;
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -54px;
        width: 168px;
        height: 168px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78);
      }

      h1 {
        margin: 0;
        font-size: 1.92rem;
        line-height: 1.2;
      }

      .subtext {
        margin: 10px 0 0;
        font-size: 1.02rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.9);
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .notice {
        border-radius: 16px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--muted);
        line-height: 1.7;
      }

      .notice--error {
        border-color: #f5c2c7;
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 700;
      }

      .search-panel {
        display: grid;
        gap: 10px;
      }

      .search-fields {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }

      .search-field {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .search-field--wide {
        grid-column: 1 / -1;
      }

      .search-label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 800;
      }

      .search-input,
      .search-select {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      .search-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .search-button,
      .search-clear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 7px 14px;
        border-radius: 999px;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .search-button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .search-clear {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--accent);
      }

      .search-error {
        margin: 0;
        color: var(--danger);
        font-size: 0.88rem;
        line-height: 1.5;
        font-weight: 800;
      }

      .search-summary {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .day-group {
        display: grid;
        gap: 8px;
      }

      .day-label {
        margin: 0;
        font-size: 1rem;
        font-weight: 900;
        color: var(--accent);
      }

      .todo-help {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.5;
        font-weight: 700;
      }

      .report-card {
        display: grid;
        gap: 8px;
        padding: 11px 12px;
        border-radius: 15px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, #ffffff 0%, #fcfaf7 100%);
      }

      .report-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 8px;
        align-items: center;
      }

      .report-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
      }

      .report-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
        min-width: 0;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(240, 137, 43, 0.14);
        color: #9f4f08;
        font-size: 0.8rem;
        font-weight: 900;
      }

      .meta-pill--dark {
        background: rgba(23, 61, 95, 0.08);
        color: var(--accent);
      }

      .action-link,
      .detail-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 4rem;
        min-height: 28px;
        padding: 5px 9px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-size: 0.8rem;
        line-height: 1;
        font-weight: 800;
        white-space: nowrap;
      }

      .action-link {
        background: linear-gradient(180deg, var(--accent-strong) 0%, #dd6e11 100%);
        color: #fff;
        text-decoration: none;
        box-shadow: 0 12px 24px rgba(232, 122, 31, 0.20);
      }

      .detail-toggle {
        background: rgba(23, 61, 95, 0.06);
        color: var(--accent);
        border-color: rgba(23, 61, 95, 0.14);
        cursor: pointer;
      }

      .detail-toggle[aria-expanded="true"] {
        background: rgba(23, 61, 95, 0.12);
      }

      .report-body {
        display: grid;
        gap: 6px;
      }

      .customer-name {
        margin: 0;
        color: var(--accent);
        font-size: 0.95rem;
        line-height: 1.45;
        font-weight: 900;
        word-break: break-word;
      }

      .todo-line {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        align-items: start;
      }

      .todo-checkbox {
        margin-top: 2px;
        width: 18px;
        height: 18px;
        accent-color: var(--accent-strong);
        flex: 0 0 auto;
      }

      .todo-summary {
        margin: 0;
        color: var(--text);
        font-size: 0.98rem;
        line-height: 1.55;
        font-weight: 700;
        word-break: break-word;
      }

      .todo-feedback {
        margin: 0;
        min-height: 1.1em;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .todo-feedback--success {
        color: var(--success);
      }

      .todo-feedback--error {
        color: var(--danger);
      }

      .detail-panel {
        display: grid;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px dashed rgba(23, 61, 95, 0.14);
      }

      .detail-panel[hidden] {
        display: none !important;
      }

      .detail-row {
        display: grid;
        gap: 4px;
      }

      .detail-row--inline {
        grid-template-columns: auto minmax(0, 1fr);
        align-items: baseline;
        gap: 2px;
      }

      .detail-label {
        margin: 0;
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .detail-value {
        margin: 0;
        color: var(--text);
        font-size: 0.98rem;
        line-height: 1.6;
        font-weight: 700;
        word-break: break-word;
      }

      .detail-value--summary {
        font-size: 0.99rem;
      }

      .addition-box {
        display: grid;
        gap: 6px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(23, 61, 95, 0.12);
        background: linear-gradient(180deg, #fbfdff 0%, #f5f9fd 100%);
      }

      .addition-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        justify-content: space-between;
      }

      .addition-label {
        margin: 0;
        color: var(--accent);
        font-size: 0.84rem;
        font-weight: 900;
      }

      .addition-meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .addition-text {
        margin: 0;
        color: var(--text);
        font-size: 0.95rem;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .empty-state {
        border-radius: 18px;
        padding: 18px;
        border: 1px dashed var(--border);
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .footer-actions {
        display: grid;
        gap: 10px;
      }

      .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        border-radius: 18px;
        border: none;
        padding: 12px 18px;
        text-decoration: none;
        background: linear-gradient(180deg, var(--accent-strong) 0%, #dd6e11 100%);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 800;
        box-shadow: 0 16px 30px rgba(232, 122, 31, 0.22);
      }

      @media (min-width: 768px) {
        main {
          padding: 24px 18px 32px;
        }

        .hero {
          padding: 28px 26px;
        }

        .card {
          padding: 20px 22px;
        }

        h1 {
          font-size: 2.12rem;
        }
      }

      @media (max-width: 767px) {
        main {
          width: min(100%, 430px);
          margin: 0 auto;
          padding: calc(16px + env(safe-area-inset-top)) 15px calc(18px + env(safe-area-inset-bottom));
        }

        .layout {
          gap: 10px;
        }

        .hero {
          padding: 24px 20px;
          border-radius: 24px;
        }

        .card {
          padding: 14px;
          border-radius: 18px;
        }

        .report-card {
          padding: 10px 11px;
        }

        .action-link,
        .detail-toggle {
          min-height: 28px;
          padding: 4px 8px;
          font-size: 0.78rem;
        }

        .link-button {
          min-height: 60px;
          font-size: 1.02rem;
        }

        .todo-summary {
          font-size: 0.96rem;
        }

        .search-fields {
          grid-template-columns: 1fr;
        }

        .search-field--wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="layout">
        <section class="hero" aria-label="個人日報の概要">
          <p class="eyebrow">個人日報</p>
          <h1>営業AIメモ｜個人日報</h1>
          <p class="subtext"><?= model.userName ?> さんの直近30日分を表示します。</p>
        </section>

        <? if (model.noticeMessage) { ?>
          <section class="notice notice--error" aria-live="assertive"><?= model.noticeMessage ?></section>
        <? } ?>

        <? if (!model.noticeMessage) { ?>
          <section class="card search-panel" aria-label="日報検索">
            <form method="get" action="<?= model.topPageLinkUrl ?>">
              <input type="hidden" name="view" value="daily">
              <div class="search-fields">
                <label class="search-field">
                  <span class="search-label">期間</span>
                  <select class="search-select" name="period">
                    <option value="last_30_days" <? if (model.searchPeriod === 'last_30_days') { ?>selected<? } ?>>過去30日</option>
                    <option value="today" <? if (model.searchPeriod === 'today') { ?>selected<? } ?>>今日</option>
                    <option value="previous_day" <? if (model.searchPeriod === 'previous_day') { ?>selected<? } ?>>前日</option>
                    <option value="last_7_days" <? if (model.searchPeriod === 'last_7_days') { ?>selected<? } ?>>過去7日</option>
                    <option value="custom" <? if (model.searchPeriod === 'custom') { ?>selected<? } ?>>期間指定</option>
                  </select>
                </label>
                <label class="search-field search-field--wide">
                  <span class="search-label">キーワード（顧客名・案件テーマ・商談内容・ToDo・追記）</span>
                  <input class="search-input" type="search" name="keyword" value="<?= model.searchKeyword ?>" autocomplete="off">
                </label>
                <label class="search-field">
                  <span class="search-label">開始日</span>
                  <input class="search-input" type="date" name="start_date" value="<?= model.searchStartDate ?>">
                </label>
                <label class="search-field">
                  <span class="search-label">終了日</span>
                  <input class="search-input" type="date" name="end_date" value="<?= model.searchEndDate ?>">
                </label>
              </div>
              <? if (model.searchErrorMessage) { ?>
                <p class="search-error" aria-live="assertive"><?= model.searchErrorMessage ?></p>
              <? } ?>
              <div class="search-actions">
                <button class="search-button" type="submit">検索</button>
                <a class="search-clear" href="<?= model.topPageLinkUrl ?>?view=daily">条件クリア</a>
              </div>
            </form>
          </section>

          <section class="card" aria-live="polite">
            <p class="day-label"><?= model.userName ?> さんの記録</p>
            <p class="todo-help">□にチェックするとTODOにコピーされます</p>
            <? if (!model.searchErrorMessage) { ?>
              <p class="search-summary">検索結果：<?= model.searchResultCount ?>件</p>
            <? } ?>

            <? if (!model.searchErrorMessage && model.hasReportData) { ?>
              <div class="day-group">
                <? for (var groupIndex = 0; groupIndex < model.reportGroups.length; groupIndex++) { ?>
                  <? var group = model.reportGroups[groupIndex]; ?>
                  <section class="day-group" aria-label="<?= group.dateLabel ?>">
                    <p class="day-label"><?= group.dateLabel ?></p>
                    <? for (var recordIndex = 0; recordIndex < group.records.length; recordIndex++) { ?>
                      <? var record = group.records[recordIndex]; ?>
                      <article class="report-card" data-report-card data-record-id="<?= record.recordId ?>">
                        <div class="report-head">
                          <div class="report-meta">
                            <span class="meta-pill"><?= record.timeLabel ?></span>
                            <span class="meta-pill meta-pill--dark"><?= record.inputMethod ?></span>
                            <span class="meta-pill meta-pill--dark"><?= record.userName ?></span>
                          </div>
                          <div class="report-actions">
                            <? if (record.canAdd) { ?>
                              <a class="action-link" href="<?= model.topPageLinkUrl ?>?view=daily&record_id=<?= record.recordId ?>" target="_top" rel="noopener">追記</a>
                            <? } ?>
                            <button
                              type="button"
                              class="detail-toggle"
                              aria-expanded="false"
                              aria-controls="detail-<?= record.recordId ?>"
                              data-detail-toggle
                            >詳細</button>
                          </div>
                        </div>

                        <div class="report-body">
                          <p class="customer-name"><?= record.customerName ?></p>

                          <div class="todo-line">
                            <input
                              type="checkbox"
                              class="todo-checkbox"
                              data-todo-checkbox
                              data-record-id="<?= record.recordId ?>"
                              data-can-create-todo="<?= record.canCreateTodo ? '1' : '0' ?>"
                              data-has-active-todo="<?= record.hasActiveTodo ? '1' : '0' ?>"
                              <? if (!record.canCreateTodo) { ?>disabled aria-disabled="true"<? } ?>
                              <? if (record.hasActiveTodo) { ?>checked disabled aria-disabled="true"<? } ?>
                            >
                            <p class="todo-summary"><?= record.dealSummary ?></p>
                          </div>

                          <p class="todo-feedback" data-todo-feedback aria-live="polite" hidden></p>
                        </div>

                        <div class="detail-panel" id="detail-<?= record.recordId ?>" hidden>
                          <div class="detail-grid">
                            <div class="detail-row detail-row--inline">
                              <p class="detail-label">テーマ：</p>
                              <p class="detail-value"><?= record.dealTheme ?></p>
                            </div>
                            <div class="detail-row">
                              <p class="detail-label">商談内容</p>
                              <p class="detail-value"><?= record.dealContent ?></p>
                            </div>
                          </div>

                          <? if (record.additions && record.additions.length > 0) { ?>
                            <div class="detail-grid">
                              <p class="detail-label">追記一覧</p>
                              <? for (var additionIndex = 0; additionIndex < record.additions.length; additionIndex++) { ?>
                                <? var addition = record.additions[additionIndex]; ?>
                                <section class="addition-box">
                                  <div class="addition-head">
                                    <p class="addition-label">追記</p>
                                    <p class="addition-meta"><?= addition.addedAtLabel ?> ・ <?= addition.addedByName ?></p>
                                  </div>
                                  <p class="addition-text"><?= addition.additionalRecord ?></p>
                                </section>
                              <? } ?>
                            </div>
                          <? } ?>
                        </div>
                      </article>
                    <? } ?>
                  </section>
                <? } ?>
              </div>
            <? } else if (!model.searchErrorMessage) { ?>
              <div class="empty-state"><?= model.emptyMessage ?></div>
            <? } ?>
          </section>
        <? } ?>

        <? if (model.topPageLinkUrl) { ?>
          <section class="footer-actions">
            <a class="link-button" href="<?= model.topPageLinkUrl ?>" target="_top" rel="noopener">TOPへ戻る</a>
          </section>
        <? } ?>
      </div>
    </main>
    <script>
      (() => {
        const cards = document.querySelectorAll('[data-report-card]');

        cards.forEach((card) => {
          const detailToggle = card.querySelector('[data-detail-toggle]');
          const detailPanel = card.querySelector('.detail-panel');
          if (detailToggle && detailPanel) {
            detailToggle.addEventListener('click', () => {
              const expanded = detailToggle.getAttribute('aria-expanded') === 'true';
              const nextExpanded = !expanded;
              detailToggle.setAttribute('aria-expanded', String(nextExpanded));
              detailPanel.hidden = !nextExpanded;
            });
          }

          const checkbox = card.querySelector('[data-todo-checkbox]');
          const feedback = card.querySelector('[data-todo-feedback]');
          if (!checkbox) {
            return;
          }

          const recordId = String(checkbox.getAttribute('data-record-id') || '').trim();
          const canCreateTodo = checkbox.getAttribute('data-can-create-todo') === '1';
          const hasActiveTodo = checkbox.getAttribute('data-has-active-todo') === '1';

          checkbox.checked = hasActiveTodo;
          checkbox.disabled = hasActiveTodo || !canCreateTodo;

          const showFeedback = (message, kind) => {
            if (!feedback) {
              return;
            }

            feedback.textContent = message;
            feedback.hidden = !message;
            feedback.classList.remove('todo-feedback--success', 'todo-feedback--error');
            if (kind) {
              feedback.classList.add(kind);
            }
          };

          if (hasActiveTodo) {
            showFeedback('', '');
          }

          checkbox.addEventListener('change', () => {
            if (!checkbox.checked) {
              return;
            }

            if (!recordId || !canCreateTodo || checkbox.disabled) {
              checkbox.checked = false;
              return;
            }

            checkbox.disabled = true;
            showFeedback('TODOを登録中です。', '');

            google.script.run
              .withSuccessHandler((result) => {
                if (result && result.success === true) {
                  checkbox.checked = true;
                  checkbox.disabled = true;
                  showFeedback('TODOを登録しました。', 'todo-feedback--success');
                  return;
                }

                checkbox.checked = false;
                checkbox.disabled = false;
                showFeedback(
                  String(result && result.errorMessage ? result.errorMessage : 'TODOの登録に失敗しました。'),
                  'todo-feedback--error',
                );
              })
              .withFailureHandler((error) => {
                checkbox.checked = false;
                checkbox.disabled = false;
                showFeedback(
                  String(error && error.message ? error.message : 'TODOの登録に失敗しました。'),
                  'todo-feedback--error',
                );
              })
              .createTodoFromDeal(recordId);
          });
        });
      })();
    </script>
  </body>
</html>
