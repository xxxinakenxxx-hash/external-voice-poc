<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title><?= model.pageTitle ?></title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe7;
        --panel: #ffffff;
        --panel-soft: #faf6ef;
        --text: #1f2937;
        --muted: #5c6877;
        --accent: #173d5f;
        --accent-strong: #f0892b;
        --border: #d8e0ea;
        --shadow: 0 16px 38px rgba(23, 61, 95, 0.12);
        --danger: #b42318;
        --danger-soft: #fdecec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(240, 137, 43, 0.12), transparent 36%),
          radial-gradient(circle at bottom right, rgba(23, 61, 95, 0.10), transparent 30%),
          linear-gradient(180deg, #fdf8ef 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: calc(14px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .layout {
        display: grid;
        gap: 12px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        padding: 22px 20px;
        background: linear-gradient(135deg, rgba(23, 61, 95, 0.98), rgba(30, 83, 128, 0.96));
        color: #fff;
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -54px;
        width: 168px;
        height: 168px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78);
      }

      h1 {
        margin: 0;
        font-size: 1.92rem;
        line-height: 1.2;
      }

      .subtext {
        margin: 10px 0 0;
        font-size: 1.02rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.9);
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .notice {
        border-radius: 16px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--muted);
        line-height: 1.7;
      }

      .notice--error {
        border-color: #f5c2c7;
        background: var(--danger-soft);
        color: var(--danger);
        font-weight: 700;
      }

      .search-form {
        display: grid;
        gap: 12px;
      }

      .search-grid {
        display: grid;
        gap: 10px;
      }

      .search-field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .search-field label {
        color: var(--accent);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .search-field input,
      .search-field select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      .search-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .search-button,
      .clear-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 14px;
        padding: 8px 12px;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .search-button {
        border: none;
        background: var(--accent);
        color: #fff;
      }

      .clear-button {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--accent);
      }

      .search-status {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .summary-grid {
        display: grid;
        gap: 12px;
      }

      .summary-card {
        display: grid;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, #ffffff 0%, #fcfaf7 100%);
      }

      .summary-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 8px;
        align-items: center;
      }

      .summary-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(240, 137, 43, 0.14);
        color: #9f4f08;
        font-size: 0.84rem;
        font-weight: 900;
      }

      .meta-pill--dark {
        background: rgba(23, 61, 95, 0.08);
        color: var(--accent);
      }

      .summary-grid-inner {
        display: grid;
        gap: 4px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: minmax(110px, 0.9fr) minmax(0, 2.8fr);
        gap: 8px;
        align-items: center;
      }

      .summary-grid-inner > .detail-grid + .detail-grid,
      .detail-grid > .detail-row:nth-child(n + 3) {
        display: none;
      }

      .detail-row {
        min-width: 0;
      }

      .detail-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .detail-value {
        margin: 0;
        color: var(--text);
        font-size: 0.92rem;
        line-height: 1.45;
        font-weight: 700;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        word-break: break-word;
      }

      .detail-grid > .detail-row:first-child .detail-value {
        color: var(--accent);
        font-weight: 900;
      }

      .detail-value--summary {
        white-space: normal;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .action-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        justify-self: end;
        min-width: 3.8rem;
        min-height: 28px;
        padding: 5px 9px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--accent-strong) 0%, #dd6e11 100%);
        color: #fff;
        text-decoration: none;
        font-size: 0.8rem;
        line-height: 1;
        font-weight: 800;
        box-shadow: 0 12px 24px rgba(232, 122, 31, 0.20);
        white-space: nowrap;
      }

      .addition-box {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid rgba(23, 61, 95, 0.12);
        background: linear-gradient(180deg, #fbfdff 0%, #f5f9fd 100%);
      }

      .addition-head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
      }

      .addition-label {
        margin: 0;
        color: var(--accent);
        font-size: 0.88rem;
        font-weight: 900;
      }

      .addition-meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 700;
      }

      .addition-text {
        margin: 0;
        color: var(--text);
        font-size: 0.98rem;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .empty-state {
        border-radius: 18px;
        padding: 18px;
        border: 1px dashed var(--border);
        background: rgba(255, 255, 255, 0.72);
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .footer-actions {
        display: grid;
        gap: 12px;
      }

      .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        border-radius: 18px;
        border: none;
        padding: 12px 18px;
        text-decoration: none;
        background: linear-gradient(180deg, var(--accent-strong) 0%, #dd6e11 100%);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 800;
        box-shadow: 0 16px 30px rgba(232, 122, 31, 0.22);
      }

      @media (min-width: 768px) {
        main {
          padding: 24px 18px 32px;
        }

        .hero {
          padding: 28px 26px;
        }

        .card {
          padding: 20px 22px;
        }

        h1 {
          font-size: 2.12rem;
        }

        .search-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .search-field--keyword {
          grid-column: span 2;
        }
      }

      @media (max-width: 767px) {
        main {
          width: min(100%, 430px);
          margin: 0 auto;
          padding: calc(16px + env(safe-area-inset-top)) 15px calc(18px + env(safe-area-inset-bottom));
        }

        .layout {
          gap: 10px;
        }

        .hero {
          padding: 24px 20px;
          border-radius: 24px;
        }

        .card {
          padding: 16px;
          border-radius: 20px;
        }

        .summary-card {
          gap: 6px;
          padding: 10px;
        }

        .detail-grid {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .detail-value--summary {
          -webkit-line-clamp: 3;
        }

        .action-link {
          min-width: 4rem;
          min-height: 30px;
          padding: 5px 9px;
          font-size: 0.8rem;
        }

        .link-button {
          min-height: 60px;
          font-size: 1.02rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="layout">
        <section class="hero" aria-label="日報まとめの概要">
          <p class="eyebrow">管理職向け</p>
          <h1>営業AIメモ｜日報まとめ</h1>
          <p class="subtext">期間・担当者・キーワードで、閲覧権限の範囲内の日報を検索できます。</p>
        </section>

        <? if (model.noticeMessage) { ?>
          <section class="notice notice--error" aria-live="assertive"><?= model.noticeMessage ?></section>
        <? } ?>

        <? if (!model.noticeMessage) { ?>
          <section class="card" aria-label="日報検索">
            <form class="search-form" method="get" action="<?= model.topPageLinkUrl ?>">
              <input type="hidden" name="view" value="summary">
              <div class="search-grid">
                <div class="search-field">
                  <label for="search-period">期間</label>
                  <select id="search-period" name="period">
                    <option value="today" <? if (model.searchPeriod === 'today') { ?>selected<? } ?>>今日</option>
                    <option value="previous_day" <? if (model.searchPeriod === 'previous_day') { ?>selected<? } ?>>前日</option>
                    <option value="last_7_days" <? if (model.searchPeriod === 'last_7_days') { ?>selected<? } ?>>過去7日</option>
                    <option value="last_30_days" <? if (model.searchPeriod === 'last_30_days') { ?>selected<? } ?>>過去30日</option>
                    <option value="custom" <? if (model.searchPeriod === 'custom') { ?>selected<? } ?>>期間指定</option>
                  </select>
                </div>
                <div class="search-field">
                  <label for="search-staff">担当者</label>
                  <select id="search-staff" name="staff_name">
                    <option value="">全担当者</option>
                    <? for (var staffIndex = 0; staffIndex < model.searchStaffOptions.length; staffIndex++) { ?>
                      <? var staff = model.searchStaffOptions[staffIndex]; ?>
                      <option value="<?= staff.userName ?>" <? if (model.searchStaffName === staff.userName) { ?>selected<? } ?>><?= staff.userName ?></option>
                    <? } ?>
                  </select>
                </div>
                <div class="search-field">
                  <label for="search-start-date">開始日（期間指定時）</label>
                  <input id="search-start-date" name="start_date" type="date" value="<?= model.searchStartDate ?>">
                </div>
                <div class="search-field">
                  <label for="search-end-date">終了日（期間指定時）</label>
                  <input id="search-end-date" name="end_date" type="date" value="<?= model.searchEndDate ?>">
                </div>
                <div class="search-field search-field--keyword">
                  <label for="search-keyword">キーワード（顧客名・案件テーマ・商談内容・追記内容）</label>
                  <input id="search-keyword" name="keyword" type="search" value="<?= model.searchKeyword ?>" placeholder="キーワードを入力">
                </div>
              </div>
              <div class="search-actions">
                <button class="search-button" type="submit">検索</button>
                <a class="clear-button" href="<?= model.topPageLinkUrl ?>?view=summary">条件クリア</a>
              </div>
            </form>
            <? if (model.searchErrorMessage) { ?>
              <p class="notice notice--error" aria-live="assertive"><?= model.searchErrorMessage ?></p>
            <? } else { ?>
              <p class="search-status" aria-live="polite">検索結果：<?= model.searchResultCount ?>件</p>
            <? } ?>
          </section>

          <section class="card" aria-live="polite">
            <p class="eyebrow" style="color: var(--accent);"><?= model.currentDateLabel ?></p>
            <p class="detail-label">閲覧範囲の商談記録</p>

            <? if (model.hasSummaryData) { ?>
              <div class="summary-grid">
                <? for (var rowIndex = 0; rowIndex < model.summaryRows.length; rowIndex++) { ?>
                  <? var row = model.summaryRows[rowIndex]; ?>
                  <article class="summary-card">
                    <div class="summary-head">
                      <div class="summary-meta">
                        <span class="meta-pill"><?= row.timeLabel ?></span>
                        <span class="meta-pill meta-pill--dark"><?= row.inputMethod ?></span>
                        <span class="meta-pill meta-pill--dark"><?= row.userName ?></span>
                      </div>
                      <? if (row.canAdd) { ?>
                        <a class="action-link" href="<?= model.topPageLinkUrl ?>?view=daily&record_id=<?= row.recordId ?>" target="_top" rel="noopener">追記</a>
                      <? } ?>
                    </div>

                    <div class="summary-grid-inner">
                      <div class="detail-grid">
                        <div class="detail-row">
                          <p class="detail-label">訪問先</p>
                          <p class="detail-value"><?= row.customerName ?></p>
                        </div>
                        <div class="detail-row">
                          <p class="detail-label">商談要点</p>
                          <p class="detail-value detail-value--summary"><?= row.dealSummary ?></p>
                        </div>
                        <div class="detail-row">
                          <p class="detail-label">案件テーマ</p>
                          <p class="detail-value"><?= row.dealTheme ?></p>
                        </div>
                        <div class="detail-row">
                          <p class="detail-label">商談内容</p>
                          <p class="detail-value"><?= row.dealContent ?></p>
                        </div>
                      </div>

                      <? if (row.additions && row.additions.length > 0) { ?>
                        <div class="detail-grid">
                          <? for (var additionIndex = 0; additionIndex < row.additions.length; additionIndex++) { ?>
                            <? var addition = row.additions[additionIndex]; ?>
                            <section class="addition-box">
                              <div class="addition-head">
                                <p class="addition-label">追記</p>
                                <p class="addition-meta"><?= addition.addedAtLabel ?> ・ <?= addition.addedByName ?></p>
                              </div>
                              <p class="addition-text"><?= addition.additionalRecord ?></p>
                            </section>
                          <? } ?>
                        </div>
                      <? } ?>
                    </div>
                  </article>
                <? } ?>
              </div>
            <? } else { ?>
              <div class="empty-state"><?= model.emptyMessage ?></div>
            <? } ?>
          </section>
        <? } ?>

        <? if (model.topPageLinkUrl) { ?>
          <section class="footer-actions">
            <a class="link-button" href="<?= model.topPageLinkUrl ?>" target="_top" rel="noopener">TOPへ戻る</a>
          </section>
        <? } ?>
      </div>
    </main>
  </body>
</html>
